name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-cli:
    name: Linux CLI (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the engine version matches the tag
        run: |
          engine="$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)"
          if [[ "$engine" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::engine/Cargo.toml is $engine but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install Rust and musl
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Build a static binary
        working-directory: engine
        run: |
          cargo test
          cargo build --release --target ${{ matrix.target }}
          ./target/${{ matrix.target }}/release/superwarm --demo report month

      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/superwarm-$version-${{ matrix.target }}.tar.gz" -C engine/target/${{ matrix.target }}/release superwarm

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: linux-cli
    runs-on: macos-latest
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      # Optional: Developer ID signing and notarization. Without these the app is
      # ad-hoc signed; Sparkle updates are still verified with the EdDSA key.
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version

      - name: Check the update signing key is configured
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is missing; installed apps could not verify this update."
            exit 1
          fi

      - name: Check the tag matches the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/package-release.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Checksum every asset
        run: |
          cd dist
          shasum -a 256 Superwarm-*.zip superwarm-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Superwarm-$version.zip" dist/superwarm-*.tar.gz dist/SHA256SUMS dist/appcast.xml \
            --title "Superwarm $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag "${flags[@]}"
