[package]
name = "superwarm"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Estimate the carbon footprint of AI coding agents (Claude Code, Codex) from their local logs"
license = "MIT"
repository = "https://github.com/camggould/superwarm"
readme = "../README.md"
keywords = ["carbon", "emissions", "claude", "codex", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "superwarm"
path = "src/lib.rs"

[[bin]]
name = "superwarm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
libc = "0.2"
memchr = "2"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
